site_name: Tool Augmented AI
site_url: https://toolaugmented.ai
site_description: The function calling / tool calling reference. How it works, how to use it with every provider, how to build training data, fine-tune and evaluate models.
site_author: Reego Software (reego.ai)
copyright: Built by <a href="https://www.reego.software">reego.software</a> · <a href="https://www.reego.ai">reego.ai</a> · Try function calling at <a href="https://toolcalling.ai/">toolcalling.ai</a>

nav:
  - Home: index.md
  - Learn:
      - What is Function Calling: concepts.md
      - Using Function Calling: usage.md
      - Providers Compared: providers.md
      - Model Context Protocol (MCP): mcp.md
      - Structured Outputs vs Tools: structured-outputs.md
      - Security: security.md
  - Fine-Tuning:
      - The Recipe: recipe.md
      - Fine-Tuning Guide: fine-tuning.md
      - Turn: turn.md
      - Function Call: function-call.md
      - Adversarial User Cases: adversarial-user-cases.md
      - Variants: variants.md
      - Training Data: best-practices-for-training-data.md
  - Best Practices:
      - General: best-practices.md
      - Schema: best-practices-for-schema.md
      - System Instruction: best-practices-for-system-instruction.md
      - Tool Output: best-practices-for-tool-output.md
      - Tool Search: function-pivoting-aka-tool-search.md
      - Recommendations: recommendations-for-improvement.md
  - Evaluate:
      - Evaluation: evaluation.md
      - Benchmarks: benchmarks.md
  - Resources:
      - Links & Datasets: resources.md
      - Glossary: glossary.md
      - FAQ: faq.md
  - About: about.md

theme:
  name: material
  language: en
  logo: img/fine-tuning.webp
  favicon: img/favicon.ico
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

extra:
  analytics:
    provider: google
    property: G-1QBSCMM6PM
  social:
    - icon: material/rocket-launch
      link: https://app.toolcalling.ai/
      name: Try function calling at toolcalling.ai
    - icon: material/trophy
      link: https://toolcalling.ai/leaderboard
      name: Tool-calling leaderboard

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/external-links.js

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
